name: Update RSS Feed

on:
  schedule:
    - cron: '0 * * * *' # Запуск каждый час в 00 минут (можно изменить на '*/30 * * * *' для каждых 30 мин)
  workflow_dispatch: # Позволяет запустить вручную

jobs:
  update-rss:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run RSS generator script
        run: python gazeta_rss.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add gazeta_sosnovka_rss.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update RSS feed [skip ci]" && git push)
